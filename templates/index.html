<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Console Dashboard | Adrihosan</title>

    <!-- Importar Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-color: #4dd2d0;
            --secondary-color: #3f6f7b;
            --dark-bg: #102e35;
            --darker-bg: #0a1f24;
            --white: #ffffff;
            --amber: #f59e0b;
            --amber-light: rgba(245, 158, 11, 0.2);
            --red: #ef4444;
            --green: #22c55e;
            --font-main: 'Poppins', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--white);
            font-family: var(--font-main);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: linear-gradient(145deg, #102e35, #163d46);
            padding: 2rem;
            border-radius: 16px;
        }

        /* Header */
        header {
            text-align: center;
            margin-bottom: 25px;
        }

        h1, h2, h3 {
            color: var(--primary-color);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 8px;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9rem;
            font-weight: 300;
        }

        /* Tab Navigation */
        .tab-navigation {
            display: flex;
            gap: 8px;
            margin-bottom: 30px;
            padding: 8px;
            background: rgba(63, 111, 123, 0.15);
            border-radius: 12px;
            border: 1px solid var(--secondary-color);
            flex-wrap: wrap;
        }

        .tab-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 20px;
            background: transparent;
            border: 2px solid transparent;
            border-radius: 8px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            font-family: var(--font-main);
            transition: all 0.3s ease;
        }

        .tab-btn:hover {
            color: var(--primary-color);
            background: rgba(77, 210, 208, 0.1);
        }

        .tab-btn.active {
            background: var(--primary-color);
            color: var(--dark-bg);
            border-color: var(--primary-color);
        }

        .tab-btn svg {
            width: 18px;
            height: 18px;
        }

        /* Tab Content */
        .tab-content {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: rgba(63, 111, 123, 0.2);
            border: 1px solid var(--secondary-color);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .stat-card:hover {
            border-color: var(--primary-color);
            transform: translateY(-3px);
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary-color);
        }

        .stat-label {
            color: rgba(255, 255, 255, 0.6);
            margin-top: 5px;
            text-transform: uppercase;
            font-size: 0.7rem;
            letter-spacing: 1px;
            font-weight: 600;
        }

        /* Winner Card */
        .winner-card {
            background: linear-gradient(90deg, #3f6f7b 0%, #4dd2d0 100%);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
            text-align: center;
            color: var(--dark-bg);
        }

        .winner-card h2 {
            font-size: 1.2rem;
            margin-bottom: 12px;
            color: var(--dark-bg) !important;
        }

        .winner-url {
            font-size: 0.95rem;
            word-break: break-all;
            margin-bottom: 15px;
            font-weight: 400;
        }

        .winner-stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
        }

        .winner-stat-value {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .winner-stat-label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        /* Table Container */
        .table-container {
            background: rgba(63, 111, 123, 0.15);
            border: 1px solid var(--secondary-color);
            border-radius: 12px;
            overflow: hidden;
        }

        .table-header {
            padding: 18px 20px;
            border-bottom: 1px solid var(--secondary-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .table-header h2 {
            font-size: 1rem;
        }

        .badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .badge-primary {
            background: rgba(77, 210, 208, 0.2);
            color: var(--primary-color);
        }

        .badge-amber {
            background: var(--amber-light);
            color: var(--amber);
        }

        .badge-green {
            background: rgba(34, 197, 94, 0.2);
            color: var(--green);
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 6px;
            padding: 0 12px 12px 12px;
        }

        th {
            text-align: left;
            padding: 10px 15px;
            color: var(--primary-color);
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.7rem;
            letter-spacing: 0.5px;
            border-bottom: 2px solid var(--secondary-color);
        }

        tr {
            background-color: rgba(255, 255, 255, 0.03);
            transition: all 0.2s ease;
        }

        thead tr {
            background: transparent;
        }

        tbody tr:hover {
            background-color: rgba(77, 210, 208, 0.1);
        }

        tbody tr.highlight-amber {
            background-color: var(--amber-light);
            border-left: 3px solid var(--amber);
        }

        tbody tr.highlight-amber:hover {
            background-color: rgba(245, 158, 11, 0.3);
        }

        td {
            padding: 12px 15px;
            border: none;
            font-size: 0.85rem;
        }

        /* Ranking Badges */
        .rank {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background-color: var(--secondary-color);
            color: var(--white);
            font-weight: 600;
            font-size: 0.75rem;
        }

        .rank-1 { background: linear-gradient(135deg, #FFD700, #FFA500); color: var(--dark-bg); }
        .rank-2 { background: linear-gradient(135deg, #C0C0C0, #A8A8A8); color: var(--dark-bg); }
        .rank-3 { background: linear-gradient(135deg, #CD7F32, #8B4513); }

        /* Links and URLs */
        .url-cell {
            max-width: 350px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 400;
            transition: color 0.2s;
        }

        a:hover {
            color: var(--white);
        }

        /* Metrics */
        .metric {
            font-weight: 600;
        }

        .metric-clicks { color: var(--primary-color); }
        .metric-impressions { color: #6dd5ed; }
        .metric-ctr { color: #FFD700; }
        .metric-ctr.low { color: var(--red); }
        .metric-position { color: #a78bfa; }
        .metric-position.amber { color: var(--amber); font-weight: 700; }

        /* Action Tags */
        .action-tag {
            display: inline-block;
            padding: 4px 10px;
            background: rgba(239, 68, 68, 0.2);
            color: var(--red);
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .intent-tag {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .intent-compra {
            background: rgba(34, 197, 94, 0.2);
            color: var(--green);
        }

        .intent-producto {
            background: rgba(77, 210, 208, 0.2);
            color: var(--primary-color);
        }

        .keyword-tag {
            display: inline-block;
            padding: 2px 8px;
            background: rgba(167, 139, 250, 0.2);
            color: #a78bfa;
            border-radius: 4px;
            font-size: 0.65rem;
            margin: 2px;
        }

        /* Loading State */
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: rgba(255, 255, 255, 0.6);
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--secondary-color);
            border-top-color: var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Error State */
        .error-message {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.5);
            border-radius: 12px;
            padding: 25px;
            text-align: center;
        }

        .error-message h3 {
            color: var(--red) !important;
            margin-bottom: 10px;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: rgba(255, 255, 255, 0.5);
        }

        .empty-state svg {
            width: 60px;
            height: 60px;
            margin-bottom: 15px;
            opacity: 0.5;
        }

        /* Footer */
        footer {
            text-align: center;
            margin-top: 30px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.8rem;
            font-weight: 300;
        }

        footer a {
            color: var(--primary-color);
        }

        /* Query Form */
        .query-form {
            background: rgba(63, 111, 123, 0.15);
            border: 1px solid var(--secondary-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
        }

        .query-form h3 {
            margin-bottom: 15px;
            font-size: 0.95rem;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            align-items: end;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            color: var(--primary-color);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .form-group select {
            padding: 10px 12px;
            border: 1px solid var(--secondary-color);
            border-radius: 6px;
            background: rgba(63, 111, 123, 0.2);
            color: var(--white);
            font-size: 0.85rem;
            font-family: var(--font-main);
        }

        .form-group select:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .form-group select option {
            background: var(--dark-bg);
        }

        .btn-filter {
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            border: 2px solid var(--primary-color);
            background-color: var(--primary-color);
            color: var(--dark-bg);
            cursor: pointer;
            font-family: var(--font-main);
            transition: all 0.2s;
        }

        .btn-filter:hover {
            background-color: var(--white);
            color: var(--primary-color);
        }

        .quick-filters {
            display: flex;
            gap: 8px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .quick-btn {
            padding: 6px 14px;
            background: transparent;
            border: 1px solid var(--secondary-color);
            border-radius: 20px;
            color: rgba(255,255,255,0.7);
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.3s;
            font-family: var(--font-main);
        }

        .quick-btn:hover, .quick-btn.active {
            background: rgba(77, 210, 208, 0.2);
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        /* Responsive */
        @media (max-width: 900px) {
            .container { padding: 1rem; }
            h1 { font-size: 1.5rem; }
            .tab-btn { padding: 10px 14px; font-size: 0.75rem; }
            .tab-btn span { display: none; }
            .stat-value { font-size: 1.6rem; }
            th, td { padding: 8px 10px; font-size: 0.75rem; }
            .url-cell { max-width: 150px; }
            .form-grid { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Search Console Dashboard</h1>
            <p class="subtitle" id="date-range">Cargando datos...</p>
        </header>

        <!-- Tab Navigation -->
        <nav class="tab-navigation">
            <button class="tab-btn active" data-tab="performance">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/>
                </svg>
                <span>Rendimiento</span>
            </button>
            <button class="tab-btn" data-tab="ctr">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>
                </svg>
                <span>Oportunidades CTR</span>
            </button>
            <button class="tab-btn" data-tab="quickwins">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
                </svg>
                <span>Quick Wins</span>
            </button>
            <button class="tab-btn" data-tab="transactional">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
                    <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
                </svg>
                <span>Transaccional</span>
            </button>
        </nav>

        <!-- Tab 1: Rendimiento General -->
        <div class="tab-content active" id="tab-performance">
            <!-- Formulario de Filtros -->
            <div class="query-form">
                <h3>Consulta Personalizada</h3>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Dimension</label>
                        <select id="filter-dimension">
                            <option value="page">Paginas</option>
                            <option value="query">Keywords</option>
                            <option value="country">Paises</option>
                            <option value="device">Dispositivos</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Periodo</label>
                        <select id="filter-days">
                            <option value="7">7 dias</option>
                            <option value="28">28 dias</option>
                            <option value="90" selected>90 dias</option>
                            <option value="180">6 meses</option>
                            <option value="365">1 ano</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Resultados</label>
                        <select id="filter-limit">
                            <option value="10" selected>Top 10</option>
                            <option value="25">Top 25</option>
                            <option value="50">Top 50</option>
                            <option value="100">Top 100</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <button class="btn-filter" onclick="applyFilters()">Consultar</button>
                    </div>
                </div>
                <div class="quick-filters">
                    <button class="quick-btn" onclick="quickFilter('page', 90, 10)">Top Paginas 90d</button>
                    <button class="quick-btn" onclick="quickFilter('query', 28, 25)">Keywords 28d</button>
                    <button class="quick-btn" onclick="quickFilter('country', 90, 10)">Por Pais</button>
                    <button class="quick-btn" onclick="quickFilter('device', 90, 10)">Por Dispositivo</button>
                    <button class="quick-btn" onclick="quickFilter('page', 7, 10)">Ultima Semana</button>
                </div>
            </div>

            <div class="loading" id="loading-performance" style="display:none;">
                <div class="loading-spinner"></div>
                <p>Cargando rendimiento...</p>
            </div>
            <div id="content-performance"></div>
        </div>

        <!-- Tab 2: Oportunidades CTR -->
        <div class="tab-content" id="tab-ctr">
            <div class="loading" id="loading-ctr">
                <div class="loading-spinner"></div>
                <p>Analizando oportunidades de CTR...</p>
            </div>
            <div id="content-ctr" style="display:none;"></div>
        </div>

        <!-- Tab 3: Quick Wins -->
        <div class="tab-content" id="tab-quickwins">
            <div class="loading" id="loading-quickwins">
                <div class="loading-spinner"></div>
                <p>Buscando Quick Wins...</p>
            </div>
            <div id="content-quickwins" style="display:none;"></div>
        </div>

        <!-- Tab 4: Transaccional -->
        <div class="tab-content" id="tab-transactional">
            <div class="loading" id="loading-transactional">
                <div class="loading-spinner"></div>
                <p>Analizando intención de compra...</p>
            </div>
            <div id="content-transactional" style="display:none;"></div>
        </div>

        <footer>
            <p>Search Console Dashboard | <a href="https://www.adrihosan.com" target="_blank">adrihosan.com</a></p>
        </footer>
    </div>

    <script>
        const SITE_URL = 'https://www.adrihosan.com';

        // Tab Navigation
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const tabId = btn.dataset.tab;

                // Update buttons
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                // Update content
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                document.getElementById(`tab-${tabId}`).classList.add('active');

                // Load data if not loaded
                loadTabData(tabId);
            });
        });

        // Data loading state (performance tab not cached - allows filter changes)
        const loadedTabs = {};

        async function loadTabData(tabId) {
            // Performance tab always reloads (no cache) to support filters
            if (tabId === 'performance') {
                await loadPerformance();
                return;
            }

            if (loadedTabs[tabId]) return;

            const loaders = {
                'ctr': loadCtrOpportunities,
                'quickwins': loadQuickWins,
                'transactional': loadTransactional
            };

            if (loaders[tabId]) {
                await loaders[tabId]();
                loadedTabs[tabId] = true;
            }
        }

        // Format numbers
        function formatNumber(num) {
            return num.toLocaleString('es-ES');
        }

        function cleanUrl(url) {
            return url.replace(SITE_URL, '') || '/';
        }

        // Dimension labels
        const dimensionLabels = {
            'page': { singular: 'Pagina', plural: 'Paginas', icon: '📄' },
            'query': { singular: 'Keyword', plural: 'Keywords', icon: '🔍' },
            'country': { singular: 'Pais', plural: 'Paises', icon: '🌍' },
            'device': { singular: 'Dispositivo', plural: 'Dispositivos', icon: '📱' }
        };

        // Apply filters
        function applyFilters() {
            const dimension = document.getElementById('filter-dimension').value;
            const days = document.getElementById('filter-days').value;
            const limit = document.getElementById('filter-limit').value;
            loadPerformance(dimension, days, limit);
        }

        // Quick filter
        function quickFilter(dimension, days, limit) {
            document.getElementById('filter-dimension').value = dimension;
            document.getElementById('filter-days').value = days;
            document.getElementById('filter-limit').value = limit;
            loadPerformance(dimension, days, limit);
        }

        // Tab 1: Performance
        async function loadPerformance(dimension = 'page', days = 90, limit = 10) {
            const loadingEl = document.getElementById('loading-performance');
            const contentEl = document.getElementById('content-performance');

            loadingEl.style.display = 'block';
            contentEl.innerHTML = '';

            try {
                const response = await fetch(`/api/performance?dimension=${dimension}&days=${days}&limit=${limit}`);
                const data = await response.json();

                if (data.error) throw new Error(data.error);

                const dimInfo = dimensionLabels[dimension] || dimensionLabels['page'];

                document.getElementById('date-range').textContent =
                    `${data.site_url} | ${data.start_date} - ${data.end_date} (${data.days} dias)`;

                const top = data.rows[0] || {};
                const isClickable = dimension === 'page';

                const html = `
                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-value">${formatNumber(data.total_clicks)}</div>
                            <div class="stat-label">Total Clicks</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${formatNumber(data.total_impressions)}</div>
                            <div class="stat-label">Impresiones</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${data.rows.length}</div>
                            <div class="stat-label">${dimInfo.plural} Top</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${data.days}</div>
                            <div class="stat-label">Dias</div>
                        </div>
                    </div>

                    ${top.key ? `
                    <div class="winner-card">
                        <h2>${dimInfo.icon} Top #1 ${dimInfo.singular}</h2>
                        <p class="winner-url">${top.key}</p>
                        <div class="winner-stats">
                            <div>
                                <div class="winner-stat-value">${formatNumber(top.clicks)}</div>
                                <div class="winner-stat-label">Clicks</div>
                            </div>
                            <div>
                                <div class="winner-stat-value">${formatNumber(top.impressions)}</div>
                                <div class="winner-stat-label">Impresiones</div>
                            </div>
                            <div>
                                <div class="winner-stat-value">${top.ctr}%</div>
                                <div class="winner-stat-label">CTR</div>
                            </div>
                            <div>
                                <div class="winner-stat-value">${top.position}</div>
                                <div class="winner-stat-label">Posicion</div>
                            </div>
                        </div>
                    </div>
                    ` : ''}

                    <div class="table-container">
                        <div class="table-header">
                            <h2>🔥 Top ${dimInfo.plural} por Clicks</h2>
                            <span class="badge badge-primary">${dimension} | ${data.days} dias</span>
                        </div>

                                    <th>CTR</th>

                                    <td><span class="rank ${i < 3 ? 'rank-' + (i+1) : ''}">${i+1}</span></td>

                                            ? `<a href="${row.key}" target="_blank" title="${row.key}">${cleanUrl(row.key)}</a>`

                contentEl.innerHTML = html;

            } catch (error) {
                loadingEl.style.display = 'none';

                    <div class="error-message">
                        <h3>Error al cargar datos</h3>
                        <p>${error.message}</p>
                    </div>
